
{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Edit Doctor</h1>
    <p>Update doctor information.</p>
</div>

{% if message %}
    <div class="form-message {{ message_type }}">
        {{ message }}
    </div>
{% endif %}

{% if doctor %}
<div class="patient-form">
    <h2>Doctor Information</h2>

    <form method="POST">
        <div class="form-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name"
                       value="{{ doctor[1] }}" required>
            </div>

            <div class="form-group">
                <label>Specialization</label>
                <input type="text" name="specialization"
                       value="{{ doctor[2] or '' }}">
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone"
                       value="{{ doctor[3] or '' }}">
            </div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email"
                       value="{{ doctor[4] or '' }}">
            </div>

            <div class="form-group">
                <label>Department</label>
                <select name="department_id" required>
                    {% for department in departments %}
                        <option value="{{ department[0] }}"
                            {% if department[0] == doctor[5] %}selected{% endif %}>
                            {{ department[1] }}
                        </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <button type="submit">Update Doctor</button>

        <a href="{{ url_for('doctors.doctors_list') }}"
           class="clear-search">Cancel</a>
    </form>
</div>
{% endif %}

{% endblock %}
