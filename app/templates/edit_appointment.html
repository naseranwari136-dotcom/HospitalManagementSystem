
{% extends "base.html" %}

{% block content %}

<div class="page-header">
    <h1>Edit Appointment</h1>
    <p>Update appointment information.</p>
</div>

{% if message %}
    <div class="form-message {{ message_type }}">
        {{ message }}
    </div>
{% endif %}

{% if appointment %}
<div class="patient-form">
    <h2>Appointment Information</h2>

    <form method="POST">

        <div class="form-grid">

            <div class="form-group">
                <label>Patient</label>

                <select name="patient_id" required>
                    <option value="">Select Patient</option>

                    {% for patient in patients %}
                        <option value="{{ patient[0] }}"
                            {% if patient[0]|string == form_values.patient_id|string %}
                                selected
                            {% endif %}>
                            {{ patient[1] }} (ID: {{ patient[0] }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Doctor</label>

                <select name="doctor_id" required>
                    <option value="">Select Doctor</option>

                    {% for doctor in doctors %}
                        <option value="{{ doctor[0] }}"
                            {% if doctor[0]|string == form_values.doctor_id|string %}
                                selected
                            {% endif %}>
                            {{ doctor[1] }} (ID: {{ doctor[0] }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Appointment Date</label>

                <input
                    type="date"
                    name="appointment_date"
                    value="{{ form_values.appointment_date }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Appointment Time</label>

                <input
                    type="time"
                    name="appointment_time"
                    value="{{ form_values.appointment_time }}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Status</label>

                <select name="status" required>
                    {% for status in statuses %}
                        <option value="{{ status }}"
                            {% if status == form_values.status %}
                                selected
                            {% endif %}>
                            {{ status }}
                        </option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <button type="submit">
            Update Appointment
        </button>

        <a href="{{ url_for('appointments.appointment_list') }}"
           class="clear-search">
            Cancel
        </a>

    </form>
</div>
{% endif %}

{% endblock %}
